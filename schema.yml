components:
  schemas:
    CollectionVideo:
      type: object
      description: Serializer for videos in a collection.
      properties:
        id:
          type: integer
          readOnly: true
        video:
          allOf:
          - $ref: '#/components/schemas/Video'
          readOnly: true
        video_id:
          type: integer
          writeOnly: true
        notes:
          type: string
          description: User notes about why this video was added
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Display order within collection
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - video
      - video_id
    PaginatedTrackedChannelList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TrackedChannel'
    PaginatedVideoCollectionListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VideoCollectionList'
    PatchedTrackedChannel:
      type: object
      description: Serializer for tracked channels.
      properties:
        id:
          type: integer
          readOnly: true
        platform:
