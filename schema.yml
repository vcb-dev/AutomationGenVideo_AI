openapi: 3.0.3
info:
  title: AutomationGenVideo AI API
  version: 2.0.0
  description: Auto-generated API schema for video management and related services.
paths:
  /:
    get:
      operationId: root_retrieve
      description: Root view that lists all available API endpoints
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/audio/cache/{filename}:
    get:
      operationId: api_audio_cache_retrieve
      description: Serve cached audio files from AUDIO_CACHE_DIR.
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/channel/insights/:
    post:
      operationId: api_channel_insights_create
      description: |-
        POST /api/channel/insights/
        Body: { platform, username?, url?, max_posts?, start_date?, end_date?, language?, force_refresh? }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/channel/metrics/:
    post:
      operationId: api_channel_metrics_create
      description: |-
        POST /api/channel/metrics/
        Body: { platform, username?, url?, max_posts?, start_date?, end_date?, force_refresh? }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/channels/:
    get:
      operationId: api_channels_list
      description: |-
        List all tracked channels or create a new one.

        GET /api/channels/
        POST /api/channels/
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrackedChannelList'
          description: ''
    post:
      operationId: api_channels_create
      description: |-
        List all tracked channels or create a new one.

        GET /api/channels/
        POST /api/channels/
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedChannel'
          description: ''
  /api/channels/{id}/:
    get:
      operationId: api_channels_retrieve
      description: |-
        Retrieve, update or delete a tracked channel.

        GET /api/channels/{id}/
        PUT /api/channels/{id}/
        DELETE /api/channels/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedChannel'
          description: ''
    put:
      operationId: api_channels_update
      description: |-
        Retrieve, update or delete a tracked channel.

        GET /api/channels/{id}/
        PUT /api/channels/{id}/
        DELETE /api/channels/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackedChannel'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedChannel'
          description: ''
    patch:
      operationId: api_channels_partial_update
      description: |-
        Retrieve, update or delete a tracked channel.

        GET /api/channels/{id}/
        PUT /api/channels/{id}/
        DELETE /api/channels/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTrackedChannel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTrackedChannel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTrackedChannel'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedChannel'
          description: ''
    delete:
      operationId: api_channels_destroy
      description: |-
        Retrieve, update or delete a tracked channel.

        GET /api/channels/{id}/
        PUT /api/channels/{id}/
        DELETE /api/channels/{id}/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/channels/{id}/check/:
    post:
      operationId: api_channels_check_create
      description: Trigger channel check - now runs synchronously.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/channels/check-by-username/:
    post:
      operationId: api_channels_check_by_username_create
      description: |-
        Trigger check for a channel by username and platform.

        POST /api/channels/check-by-username/
        Body: { "username": "...", "platform": "..." }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/checklist/check/:
    get:
      operationId: api_checklist_check_retrieve
      description: |-
        GET: Kiểm tra cấu hình Lark (không lộ secret). Gọi thử token + quyền Base.
        Dùng để debug 403: xem app_id/base_id đang dùng và Lark trả gì.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/checklist/settings/:
    get:
      operationId: api_checklist_settings_retrieve
      description: |-
        GET: Lấy cấu hình khung giờ báo cáo.
        PUT: Cập nhật cấu hình khung giờ báo cáo.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
    put:
      operationId: api_checklist_settings_update
      description: |-
        GET: Lấy cấu hình khung giờ báo cáo.
        PUT: Cập nhật cấu hình khung giờ báo cáo.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/checklist/status/:
    get:
      operationId: api_checklist_status_retrieve
      description: Kiểm tra xem hiện tại user có được phép báo cáo hay không.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/checklist/submit/:
    post:
      operationId: api_checklist_submit_create
      description: |-
        POST: Nhận payload checklist từ frontend, lưu vào Lark Bitable (một field JSON).
        Body mong đợi: JSON với các key checklist (boolean) và chi tiết (string), có thể có isLate.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/collections/:
    get:
      operationId: api_collections_list
      description: List all collections.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVideoCollectionListList'
          description: ''
    post:
      operationId: api_collections_create
      description: Create a new collection.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoCollection'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
  /api/collections/{id}/:
    get:
      operationId: api_collections_retrieve
      description: Get collection detail with videos.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
    put:
      operationId: api_collections_update
      description: Update collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoCollection'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
    patch:
      operationId: api_collections_partial_update
      description: |-
        ViewSet for managing video collections.

        Provides:
        - List all collections
        - Create new collection
        - Get collection detail with videos
        - Update collection
        - Delete collection
        - Add video to collection
        - Remove video from collection
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVideoCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVideoCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVideoCollection'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
    delete:
      operationId: api_collections_destroy
      description: Delete collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/collections/{id}/add_video/:
    post:
      operationId: api_collections_add_video_create
      description: Add a video to collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoCollection'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
  /api/collections/{id}/add_videos/:
    post:
      operationId: api_collections_add_videos_create
      description: Add multiple videos to collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VideoCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoCollection'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
  /api/collections/{id}/remove-video/{video_id}/:
    delete:
      operationId: api_collections_remove_video_destroy
      description: Remove a video from collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      - in: path
        name: video_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/collections/{id}/videos/:
    get:
      operationId: api_collections_videos_retrieve
      description: Get all videos in collection.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Video Collection.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCollection'
          description: ''
  /api/content/{content_id}/:
    get:
      operationId: api_content_retrieve
      description: |-
        Get details of a generated content.

        GET /api/content/<content_id>/
      parameters:
      - in: path
        name: content_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/content/generate/:
    post:
      operationId: api_content_generate_create
      description: |-
        Generate marketing content based on a viral video.

        POST /api/content/generate/
        Body:
        {
            "video_id": 123,  // optional if video_description provided
            "video_description": "...",  // optional if video_id provided
            "video_title": "...",  // optional
            "content_type": "A1",  // A1, A2, A3, A4, or A5
            "brand_name": "Viễn Chí Bảo",  // optional
            "industry": "kim hoàn",  // optional
            "additional_context": "..."  // optional
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/content/generate-prompt/:
    post:
      operationId: api_content_generate_prompt_create
      description: |-
        Generate an optimized prompt based on video content.

        POST /api/content/generate-prompt/
        Body: same as generate_content
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/content/transcribe/:
    post:
      operationId: api_content_transcribe_create
      description: |-
        POST /api/content/transcribe/
        Body: { "video_url": "https://..." }
        Response: { "success": true, "transcript": "...", "char_count": N }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/content/video/{video_id}/:
    get:
      operationId: api_content_video_retrieve
      description: |-
        Get all generated contents for a video.

        GET /api/content/video/<video_id>/
      parameters:
      - in: path
        name: video_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/douyin/profile/:
    post:
      operationId: api_douyin_profile_create
      description: |-
        Fetch full Douyin channel profile (followers, likes, avatar, etc).

        POST /api/douyin/profile/
        Body: { "username": "someuser" }

        Returns full channel profile including:
        - follower_count
        - total_likes (heart count)
        - avatar_url
        - display_name
        - video_count
        - engagement_rate (calculated)

        TROUBLESHOOTING:
        If follower_count, total_likes are returning 0, it means:
        1. The channel might be PRIVATE (Apify can't access)
        2. The username might not exist
        3. Apify API might be rate limited
        4. Apify actor response format changed - check console logs for field names
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/douyin/search/:
    post:
      operationId: api_douyin_search_create
      description: |-
        Search Douyin videos by keyword or hashtag.
        Hỗ trợ "next batch": mỗi lần gọi với batchIndex tăng dần sẽ trả về pool video mới.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/facebook/analyze/:
    post:
      operationId: api_facebook_analyze_create
      description: |-
        Analyze a Facebook URL (Page or User Profile).

        POST /api/facebook/analyze
        Body:
        {
            "url": "https://www.facebook.com/...",
            "max_posts": 20,  // optional, default 20
            "force_method": "auto"  // optional: "auto", "graph", "apify"
        }

        Response:
        {
            "success": true,
            "data": {
                "type": "page" | "profile" | "group",
                "method": "graph_api" | "apify",
                "name": "Page Name",
                "identifier": "page_id",
                "followers_count": 10000 | null,
                "posts_count": 500,
                "posts": [...],
                "metadata": {...}
            }
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/facebook/channel-metrics/:
    post:
      operationId: api_facebook_channel_metrics_create
      description: |-
        Trả về metrics/biểu đồ cho kênh Facebook (không dùng Gemini).

        POST /api/facebook/channel-metrics/
        Body:
        {
            "url": "https://www.facebook.com/...",
            "max_posts": 50,          # optional (default 50)
            "force_method": "apify",  # optional: auto|graph|apify
            "force_refresh": false    # optional
        }

        Response:
        {
            "success": true,
            "data": {... raw ...},
            "metrics": {...}
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/facebook/competitor-insights/:
    post:
      operationId: api_facebook_competitor_insights_create
      description: |-
        Sinh insight kênh đối thủ (SocialLens-style) bằng Gemini.

        POST /api/facebook/competitor-insights/
        Body:
        {
            "url": "https://www.facebook.com/...",
            "max_posts": 30,          # optional
            "force_method": "auto",   # optional: auto|graph|apify
            "language": "vi",         # optional, default vi
            "force_refresh": false    # optional
        }

        Response:
        {
            "success": true,
            "data": {... thô từ FacebookHybridService ...},
            "insights_text": "Tóm tắt Chiến lược: ...",
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/facebook/detect/:
    post:
      operationId: api_facebook_detect_create
      description: |-
        Detect if URL is a Page, Group, or User Profile.

        POST /api/facebook/detect
        Body:
        {
            "url": "https://www.facebook.com/..."
        }

        Response:
        {
            "success": true,
            "data": {
                "type": "page" | "profile" | "group",
                "identifier": "page_id_or_username"
            }
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/facebook/methods/:
    get:
      operationId: api_facebook_methods_retrieve
      description: |-
        Get available analysis methods.

        GET /api/facebook/methods

        Response:
        {
            "success": true,
            "data": {
                "graph_api": true | false,
                "apify": true | false
            }
        }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Simple health check.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/{product_id}/:
    get:
      operationId: api_products_retrieve
      description: |-
        Get details of a specific product.

        GET /api/products/<product_id>/
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/catalogs/:
    get:
      operationId: api_products_catalogs_retrieve
      description: |-
        Get all product catalogs.

        GET /api/products/catalogs/
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
