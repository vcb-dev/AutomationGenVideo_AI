# Build image GPU cho RunPod. Không đụng image Railway (:latest).
# Docker Hub: viejhaf/automationgenvideo-ai:gpu
# Image không lưu trong git — git chỉ chứa Dockerfile, CI đẩy registry.

name: Docker GPU (RunPod)

on:
  workflow_dispatch:
  push:
    branches: [main, feat/runpod-gpu-voice]
    paths:
      - Dockerfile.runpod
      - requirements_gpu.txt
      - requirements_cloud.txt
      - .github/workflows/deploy-gpu.yml
      - video_management/services/local_voice_service.py
      - video_management/services/voice_backend.py
      - video_management/views/voice_views.py

concurrency:
  group: docker-gpu-ai
  cancel-in-progress: true

env:
  IMAGE: viejhaf/automationgenvideo-ai:gpu

jobs:
  build-and-push:
    name: Build & Push GPU image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
